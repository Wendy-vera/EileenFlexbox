<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table class="data-table">
        <tr class="data-table__header">
            <th colspan="2">
                Tabla de datos
            </th>
        </tr>
        <tr class="data-table__subheader">
            <th class="data-table__subheader-cell">
                Productos
            </th>
            <th class="data-table__subheader-cell">
                Total ventas
            </th>
        </tr>
        <tr class="data-table__row data-table__row--shirts">
            <th class="data-table__product-cell">
                Camisas
            </th>
            <th class="data-table__value-cell">
                $150.000
            </th>
        </tr>
        <tr class="data-table__row data-table__row--pants">
            <th class="data-table__product-cell">
                Pantalones
            </th>
            <th class="data-table__value-cell">
                $200.000
            </th>
        </tr>
        <tr class="data-table__row data-table__row--necklaces">
            <th class="data-table__product-cell">
                Collares
            </th>
            <th class="data-table__value-cell">
                $300.000
            </th>
        </tr>
        <tr class="data-table__row data-table__row--bracelets">
            <th class="data-table__product-cell">
                Manillas
            </th>
            <th class="data-table__value-cell">
                $150.000
            </th>
        </tr>
        <tr class="data-table__row data-table__row--keychains">
            <th class="data-table__product-cell">
                Llaveros
            </th>
            <th class="data-table__value-cell">
                $350.000
            </th>
        </tr>
    </table>
</body>
</html>
