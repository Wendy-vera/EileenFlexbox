<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="inscription-form">
        <h1>
            Formulario de inscripcion
        </h1>
        <div class="inscription-form__field inscription-form__field--email inscription-form__field--required">
            <label for="correo">Correo electronico</label>
            <input type="text" placeholder="Ingrese su correo electronico" required>
        </div>
        <div class="inscription-form__field inscription-form__field--name">
            <label for="">Nombre</label>
            <input type="text" placeholder="Ingrese su nombre de usuario">
        </div>
        <div class="inscription-form__field inscription-form__field--password">
            <label for="">Contraseña</label>
            <input type="text" placeholder="Ingrese la contraseña para su cuenta">
        </div>
        
        <button type="submit">Inscribirse</button>
        
    </form>
</body>
</html>
