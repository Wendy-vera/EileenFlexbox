<!DOCTYPE html>
<html lang="esp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>
            Formulario de inscripcion
        </h1>
        <div class="form__field form__field--email">
            <label for="">Correo electronico</label>
            <input type="text" placeholder="Ingrese su correo electronico" >
        </div>
        <div class="form__field form__field--name">
            <label for="">Nombre</label>
            <input type="text" placeholder="Ingrese su nombre de usuario">
        </div>
        <div class="form__field form__field--password">
            <label for="">Contraseña</label>
            <input type="text" placeholder="Ingrese la contraseña para su cuenta">
        </div>
        <div>
            <button>Inscribirse</button>
        </div>
    </div>
</body>
</html>
